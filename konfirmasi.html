*{box-sizing:border-box;}

<header id="header"></header>
<div id="status-bar">Memuat data…</div>
<main id="isi"></main>
<footer>Data konfirmasi langsung masuk ke sistem UNIFAM. Bisa diubah selama belum hari muat.</footer>

<script>
/* ====== GANTI URL INI kalau deployment Apps Script berubah ====== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';

const params = new URLSearchParams(window.location.search);
const idOrder  = params.get('order') || '';
const idLelang = params.get('id') || '';       // link lama tetap dilayani
const namaEkspedisi = (params.get('ekspedisi') || '').toUpperCase();

let jsonpN = 0;
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'gascb' + (++jsonpN) + '_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { bersih(); reject(new Error('Timeout — server terlalu lama merespons. Coba muat ulang halaman.')); }, 60000);
    function bersih(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (d) => { bersih(); resolve(d); };
    s.src = url + '&callback=' + cb;
    s.onerror = () => { bersih(); reject(new Error('Gagal terhubung ke Apps Script')); };
    document.body.appendChild(s);
  });
}

async function gas(p){
  return kirimKeServer(p);
}

/* Jalur utama fetch; JSONP hanya cadangan. Kalau keduanya gagal,
   sebab dari jalur utama yang dilaporkan — bukan sekadar "timeout". */
async function kirimKeServer(params){
  const q = Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const url = GAS_URL + '?' + q;

  let sebabUtama = '';
  try {
    const r = await fetch(url);
    if(!r.ok) {
      sebabUtama = 'server menjawab ' + r.status + ' ' + r.statusText;
    } else {
      const teks = await r.text();
      if(/^\s*<(!DOCTYPE|html)/i.test(teks)){
        throw new Error('Server mengembalikan halaman web, bukan data. Biasanya berarti deployment Apps Script perlu diatur ulang ke "Who has access: Anyone".');
      }
      let d;
      try { d = JSON.parse(teks); }
      catch(e){ throw new Error('Jawaban server tidak terbaca: ' + teks.slice(0, 120)); }
      if(d && d.error) throw new Error(d.error);
      return d;
    }
  } catch(e){
    if(!sebabUtama) sebabUtama = e.message;
    // error dari server sendiri tidak perlu diulang lewat jalur cadangan
    if(/password|action tidak dikenal|tidak ditemukan|halaman web|tidak terbaca/i.test(sebabUtama)){
      throw new Error(sebabUtama);
    }
  }

  try {
    const d = await jsonp(url);
    if(d && d.error) throw new Error(d.error);
    return d;
  } catch(e2){
    throw new Error(sebabUtama || e2.message);
  }
}

let lelang = null, bidSaya = null, konfirmasiSaya = null, orderIni = null;

function setStatus(teks, kelas){
  const el = document.getElementById('status-bar');
  el.textContent = teks;
  el.className = kelas || '';
}
function formatRupiah(n){ return "Rp " + Number(n).toLocaleString("id-ID"); }
function formatKarton(n){ return Number(n).toLocaleString("id-ID"); }
function formatCbm(n){ return Number(n).toLocaleString("id-ID",{minimumFractionDigits:1}); }

/* ---- konversi tanggal untuk <input type="date"> ----
   Sheet menyimpan dd/mm/yyyy, sedangkan input date memakai yyyy-mm-dd */
function keISO(t){
  if(!t) return '';
  const s = String(t).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function keLokal(iso){
  if(!iso) return '';
  const m = String(iso).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso).trim();
}

/* Kontener kalau tipe mobil menyebut ukuran peti kemas; selain itu darat */
function jenisKiriman(tipeMobil){
  const t = String(tipeMobil || '').toUpperCase();
  return /\b(20|40|45)\s*(FT|FEET|')|KONTENER|CONTAINER|\bHC\b|\bREEFER\b/.test(t)
    ? 'kontener' : 'darat';
}

async function muat(){
  if((!idOrder && !idLelang) || !namaEkspedisi){
    setStatus('Link tidak lengkap — minta admin kirim ulang link konfirmasinya.', 'err');
    document.getElementById('isi').innerHTML = `<div class="pesan-kosong">Link konfirmasi tidak valid.</div>`;
    return;
  }
  try{
    setStatus('Memuat data…');
    const d = await gas({action:'konfirmasi_data', idOrder, idLelang, ekspedisi:namaEkspedisi});
    orderIni = d.order || null;
    lelang = d.lelang || null;
    bidSaya = d.bid || null;
    konfirmasiSaya = d.konfirmasi || null;
    setStatus(`Data terbaru · ${new Date().toLocaleTimeString('id-ID')}`);
    render();
  }catch(err){
    setStatus('Gagal memuat: ' + err.message, 'err');
  }
}

function ambilNilai(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

async function kirimKonfirmasi(){
  const jenis = jenisKiriman(lelang.tipeMobil);
  const btn = document.getElementById('btn-kirim');

  const noPolisi = ambilNilai('nopol');
  if(!noPolisi){ document.getElementById('nopol').style.borderColor = 'var(--red)'; return; }
  document.getElementById('nopol').style.borderColor = '';

  if(jenis === 'kontener'){
    const nokon = ambilNilai('nokontener');
    if(!nokon){ document.getElementById('nokontener').style.borderColor = 'var(--red)'; return; }
    document.getElementById('nokontener').style.borderColor = '';
  }

  const data = {
    action: 'konfirmasi_submit',
    idOrder: (orderIni ? orderIni.id : idOrder), idLelang, ekspedisi: namaEkspedisi, jenis,
    noPolisi,
    namaDriver: ambilNilai('driver'),
    hpDriver:   ambilNilai('hp'),
    noKontener: ambilNilai('nokontener'),
    namaKapal:  ambilNilai('kapal'),
    etd:        keLokal(ambilNilai('etd')),
    eta:        keLokal(ambilNilai('eta')),
    jamTiba:    ambilNilai('jam'),
    catatan:    ambilNilai('catatan')
  };

  try{
    btn.disabled = true;
    setStatus('Mengirim konfirmasi…');
    await gas(data);
    setStatus('Konfirmasi terkirim. Terima kasih.', 'ok');
    await muat();
  }catch(err){
    setStatus('Gagal kirim: ' + err.message, 'err');
    btn.disabled = false;
  }
}

      <h1>Penawaran Anda Terpilih</h1>
    </div></div>

  const isi = document.getElementById('isi');

  if(!lelang){
    isi.innerHTML = `<div class="pesan-kosong">Data lelang tidak ditemukan. Kemungkinan link sudah tidak berlaku — hubungi admin UNIFAM.</div>`;
    return;
  }

  const k = konfirmasiSaya;
  const jenis = jenisKiriman(lelang.tipeMobil);
  const isKontener = jenis === 'kontener';

  // field kapal: kalau kontener, ikut dikonfirmasi ulang (default dari penawaran)
  const blokKontener = isKontener ? `
          <div class="full">
            <label>No. Kontener *</label>
            <input id="nokontener" type="text" placeholder="mis. TCLU 1234567" value="${k ? k.noKontener : ''}">
          </div>
          <div class="full">
            <label>Nama Kapal</label>
            <input id="kapal" type="text" placeholder="mis. KM Meratus" value="${k && k.namaKapal ? k.namaKapal : (bidSaya ? bidSaya.namaKapal : '')}">
          </div>
          <div>
            <label>ETD</label>
            <input id="etd" type="date" value="${keISO(k && k.etd ? k.etd : (bidSaya ? bidSaya.etd : ''))}">
          </div>
          <div>
            <label>ETA</label>
            <input id="eta" type="date" value="${keISO(k && k.eta ? k.eta : (bidSaya ? bidSaya.eta : ''))}">
          </div>` : '';

  const labelNopol = isKontener ? 'No. Polisi Trucking *' : 'No. Polisi *';

  const ringkasSudah = k ? [
    k.noPolisi,
    isKontener && k.noKontener ? 'Kontener ' + k.noKontener : '',
    k.namaDriver || '',
    k.hpDriver || '',
    k.jamTiba ? 'tiba ' + k.jamTiba : ''
  ].filter(x => x).join(' · ') : '';

  isi.innerHTML = `
    <div class="card">
      <div class="card-head">
        ${lelang.noOrder ? `<div class="no-order">
          <span class="no-l">No Order</span>
          <span class="no-v">${lelang.noOrder}</span>
        </div>` : ''}
        <div class="route">Cikande<span class="arrow">→</span>${lelang.kota}</div>
        <span class="jenis-tag ${isKontener ? 'kontener' : 'darat'}">${isKontener ? 'KONTENER' : 'DARAT'}</span>
        <dl class="rincian">
          <dt>Customer</dt><dd>${lelang.customer}</dd>
          ${lelang.alamat ? `<dt>Alamat</dt><dd>${lelang.alamat}</dd>` : ''}

        </dl>
      </div>

      <div class="muat-box">
        <span class="lbl">Jadwal<br>Pick Up / Muat</span>
        <span class="tgl">${lelang.jadwalTanggal || lelang.tanggalMuat || lelang.tanggal || '—'}${lelang.jadwalJam
          ? `<span class="jam">jam ${lelang.jadwalJam}</span>` : ''}</span>
      </div>

      <div class="form-wrap">
        ${k ? `<div class="sudah">✓ Sudah dikonfirmasi ${new Date(k.waktu).toLocaleString('id-ID')}<br>

        <div class="form-judul">Data Armada${isKontener ? ', Kontener' : ''} &amp; Driver</div>
        <div class="form-grid">
          ${blokKontener}
          <div class="full">
            <label>${labelNopol}</label>
            <input id="nopol" type="text" placeholder="B 1234 XYZ" value="${k ? k.noPolisi : ''}">
          </div>
          <div>
            <label>Nama Driver</label>
            <input id="driver" type="text" placeholder="Nama lengkap" value="${k ? k.namaDriver : ''}">
          </div>
          <div>
            <label>No. HP Driver</label>
            <input id="hp" type="text" inputmode="numeric" placeholder="08xxx" value="${k ? k.hpDriver : ''}">
          </div>
          <div class="full">
            <label>Estimasi Jam Tiba di Gudang</label>
            <input id="jam" type="time" value="${k ? k.jamTiba : ''}">
          </div>
          <div class="full">
            <label>Catatan</label>
            <textarea id="catatan" placeholder="Opsional">${k ? k.catatan : ''}</textarea>
          </div>
        </div>
        <button class="btn-kirim" id="btn-kirim" onclick="kirimKonfirmasi()">${k ? 'Update Konfirmasi' : 'Kirim Konfirmasi'}</button>
      </div>
    </div>`;
}

muat();
</script>
