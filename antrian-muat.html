<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrian Muat — PT. UNIFAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EFF2F7;--card:#FFF;--card2:#EFF2F7;
  --border:#DDE2EC;--border2:#C3CAD9;
  --text:#12172B;--text2:#2A3180;--text3:#5A6480;
  --navy:#2A3180;--navy-d:#1C2159;--teal:#1596A3;--teal-d:#0E7A85;
  --green:#12876B;--green-bg:#E8F6EF;--red:#C8443A;--red-bg:#FDEDEB;--amber:#D9820F;--amber-bg:#FFF8EC;
  --r:0px;--disp:'Barlow Condensed',Arial,sans-serif;--sans:'Barlow',Arial,sans-serif;--mono:'IBM Plex Mono','Courier New',monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;font-size:14.5px}
.hdr{background:var(--navy);padding:15px 18px;display:flex;align-items:center;gap:12px}
.hdr .ico{width:38px;height:38px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hdr h1{font-family:var(--disp);font-size:19px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.03em}
.hdr p{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.55);margin-top:2px}
nav{background:var(--navy-d)}
nav a{color:rgba(255,255,255,.75);text-decoration:none;font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:9px 13px;display:inline-block}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px}
.sec-lbl{font-family:var(--disp);font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
input[type=date]{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-family:var(--mono);font-size:13.5px;background:#fff}
.btn{padding:10px 16px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.green{background:var(--green)}
.btn.sec{background:#fff;border:1px solid var(--border2);color:var(--text2)}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:100px;background:#fff;border:1px solid var(--border);padding:10px 13px}
.stat .n{font-family:var(--mono);font-size:20px;font-weight:600}
.stat .l{font-family:var(--disp);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.card{background:#fff;border:1px solid var(--border);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--disp);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--navy);padding:10px 11px;position:sticky;top:var(--header-h,100px);z-index:10}
td{padding:10px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.belum{background:var(--amber-bg)}
tr.ditolak{background:var(--red-bg)}
.no-ant{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--navy);text-align:center;width:36px}
.jam{font-family:var(--mono);font-size:13px;font-weight:600}
.badge{display:inline-block;padding:3px 9px;font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(18,135,107,.35)}
.b-belum{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(217,130,15,.4)}
.b-ditolak{background:var(--red-bg);color:var(--red);border:1px solid rgba(200,68,58,.4)}
.btn-wa-row{padding:5px 10px;background:#25D366;color:#fff;border:none;border-radius:var(--r);font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn-wa-row:disabled{opacity:.3;cursor:default}
.eksp-group{margin-bottom:16px}
.eksp-hd{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:9px 13px;border:1px solid var(--border)}
.eksp-hd b{font-family:var(--disp);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-family:var(--mono);font-size:12.5px}
.foot{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-top:24px}
</style>
</head>
<body>
<div id="top-sticky" style="position:sticky;top:0;z-index:60">
<div class="hdr">
  <div class="ico">📋</div>
  <div>
    <h1>Antrian Muat</h1>
    <p>PT. UNIFAM — Urutan jadwal muat &amp; status konfirmasi</p>
  </div>
</div>
<nav><a href="planning.html">← Planning</a></nav>
</div>

<div class="wrap">
  <div class="toolbar">
    <input type="date" id="tgl-input">
    <button class="btn" onclick="muat()">Tampilkan</button>
    <button class="btn sec" onclick="hariIni()">Hari Ini</button>
  </div>

  <div id="isi"><div class="empty">Pilih tanggal, lalu klik Tampilkan</div></div>

  <p class="foot">PT. UNIFAM · Antrian muat per tanggal</p>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbyMkAvd7tQGkFkXpo3sjbuNa2389lVRAP4YxuUnffFn0TtUjsKkQLli-fB0QC_MWOVJqQ/exec';
let DATA=[];

function esc(s){ return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function normHP(hp){
  let s=String(hp||'').replace(/[^\d]/g,'');
  if(!s) return '';
  if(s.indexOf('62')===0) return s;
  if(s.indexOf('0')===0) return '62'+s.slice(1);
  if(s.indexOf('8')===0) return '62'+s;
  return s;
}
function hariIni(){
  const d=new Date();
  document.getElementById('tgl-input').value = d.toISOString().slice(0,10);
  muat();
}

function muat(){
  const tgl=document.getElementById('tgl-input').value;
  if(!tgl){ alert('Pilih tanggal dulu'); return; }
  document.getElementById('isi').innerHTML='<div class="empty">Memuat…</div>';
  const cb='cbAnt'+Date.now();
  let selesai=false;
  const to=setTimeout(()=>{ if(selesai)return; selesai=true; document.getElementById('isi').innerHTML='<div class="empty">Koneksi lambat, coba lagi</div>'; },25000);
  window[cb]=function(resp){
    if(selesai)return; selesai=true; clearTimeout(to);
    delete window[cb]; if(sc.parentNode) sc.parentNode.removeChild(sc);
    if(resp && resp.status==='ok'){ DATA=resp.items||[]; render(); }
    else document.getElementById('isi').innerHTML='<div class="empty">Gagal memuat data</div>';
  };
  const sc=document.createElement('script');
  sc.src=GAS_URL+'?action=getantrian&tgl='+encodeURIComponent(tgl)+'&callback='+cb;
  sc.onerror=function(){ if(selesai)return; selesai=true; clearTimeout(to); delete window[cb]; document.getElementById('isi').innerHTML='<div class="empty">Gagal terhubung</div>'; };
  document.body.appendChild(sc);
}

function pesanReminder(o){
  const jamLine = o.jam ? `🗓️ Jam Muat: ${o.jam}\n` : '';
  return `⏰ *PENGINGAT KONFIRMASI*\nPT. UNIFAM\n\nMohon konfirmasi order berikut:\n\n📦 ${o.no_order}\n🎯 ${o.tuj}\n${jamLine}\nTerima kasih 🙏`;
}
function kirimReminderSatu(idx){
  const o=DATA[idx];
  const hp=normHP(o.kontak_eksp);
  if(!hp){ alert('Nomor kontak ekspedisi '+o.ekspedisi+' belum ada di sheet rate (kolom Kontak).'); return; }
  window.open('https://wa.me/'+hp+'?text='+encodeURIComponent(pesanReminder(o)),'_blank');
}
function kirimReminderRekap(ekspedisi){
  const list=DATA.filter(o=>o.ekspedisi===ekspedisi && o.status==='belum');
  if(!list.length) return;
  const hp=normHP(list[0].kontak_eksp);
  if(!hp){ alert('Nomor kontak ekspedisi '+ekspedisi+' belum ada di sheet rate (kolom Kontak).'); return; }
  let msg=`⏰ *PENGINGAT KONFIRMASI*\nPT. UNIFAM — Ekspedisi *${ekspedisi}*\n\nMohon segera konfirmasi ${list.length} order berikut:\n`;
  list.forEach(o=>{ const jamLine=o.jam?`🗓️ Jam Muat: ${o.jam}\n`:''; msg+=`\n📦 ${o.no_order}\n🎯 ${o.tuj}\n${jamLine}`; });
  msg+='\nTerima kasih 🙏';
  window.open('https://wa.me/'+hp+'?text='+encodeURIComponent(msg),'_blank');
}

function render(){
  const isi=document.getElementById('isi');
  if(!DATA.length){ isi.innerHTML='<div class="empty">Tidak ada order untuk tanggal ini</div>'; return; }

  const total=DATA.length;
  const draftBelumKirim=DATA.filter(o=>o.status==='draft').length;
  const belum=DATA.filter(o=>o.status==='belum').length;
  const ok=DATA.filter(o=>o.status==='konfirmasi').length;
  const ditolak=DATA.filter(o=>o.status==='ditolak').length;

  let html=`<div class="stat-row">
    <div class="stat"><div class="l">Total</div><div class="n" style="color:var(--navy)">${total}</div></div>
    <div class="stat"><div class="l">Belum Dikirim</div><div class="n" style="color:var(--text3)">${draftBelumKirim}</div></div>
    <div class="stat"><div class="l">Belum Konfirmasi</div><div class="n" style="color:var(--amber)">${belum}</div></div>
    <div class="stat"><div class="l">Terkonfirmasi</div><div class="n" style="color:var(--green)">${ok}</div></div>
    <div class="stat"><div class="l">Ditolak</div><div class="n" style="color:var(--red)">${ditolak}</div></div>
  </div>`;

  // urutan antrian utuh
  html+='<div class="sec-lbl">Urutan Antrian (sesuai jam muat)</div><div class="card"><table><thead><tr><th>No</th><th>Jam</th><th>Tujuan</th><th>Ekspedisi</th><th>Sumber</th><th>Status</th><th></th></tr></thead><tbody>';
  DATA.forEach((o,i)=>{
    const cls = o.status==='belum'?'belum':(o.status==='ditolak'?'ditolak':'');
    const badge = o.status==='konfirmasi' ? '<span class="badge b-ok">✓ Konfirmasi</span>'
                : o.status==='ditolak' ? '<span class="badge b-ditolak">❌ Ditolak</span>'
                : o.status==='draft' ? '<span class="badge" style="background:var(--card2);color:var(--text3);border:1px solid var(--border2)">Belum Dikirim</span>'
                : '<span class="badge b-belum">⏳ Belum</span>';
    const btnWa = o.status==='belum'
      ? `<button class="btn-wa-row" onclick="kirimReminderSatu(${i})">💬 Ingatkan</button>`
      : '';
    const jamTampil = o.jam ? esc(o.jam) : '<span style="color:var(--text3);font-style:italic">belum diisi</span>';
    const sumber = o.dari_lelang ? '<span class="badge" style="background:#EDE9FE;color:#5B21B6;border:1px solid #C4B5FD">Lelang</span>' : '<span class="badge" style="background:var(--card2);color:var(--text3);border:1px solid var(--border2)">Planning</span>';
    html+=`<tr class="${cls}">
      <td class="no-ant">${o.no_antrian}</td>
      <td class="jam">${jamTampil}</td>
      <td>${esc(o.tuj)}</td>
      <td>${esc(o.ekspedisi)||'-'}</td>
      <td>${sumber}</td>
      <td>${badge}</td>
      <td>${btnWa}</td>
    </tr>`;
  });
  html+='</tbody></table></div>';

  // rekap per ekspedisi yg masih ada yg belum konfirmasi
  const ekspBelum={};
  DATA.filter(o=>o.status==='belum').forEach(o=>{ (ekspBelum[o.ekspedisi]=ekspBelum[o.ekspedisi]||[]).push(o); });
  const daftarEksp=Object.keys(ekspBelum);
  if(daftarEksp.length){
    html+='<div class="sec-lbl">Kirim Rekap Pengingat per Ekspedisi</div>';
    daftarEksp.forEach(ek=>{
      html+=`<div class="eksp-group"><div class="eksp-hd">
        <b>${esc(ek)||'(tanpa nama)'}</b>
        <span style="font-family:var(--mono);font-size:11.5px;color:var(--text3)">${ekspBelum[ek].length} order belum konfirmasi</span>
      </div>
      <div style="padding:10px 13px;background:#fff;border:1px solid var(--border);border-top:none">
        <button class="btn green" onclick="kirimReminderRekap('${esc(ek).replace(/'/g,"\\'")}')">💬 Kirim Rekap ke ${esc(ek)}</button>
      </div></div>`;
    });
  }

  isi.innerHTML=html;
}

// ukur tinggi header+nav sticky, dipakai supaya header tabel menempel TEPAT di bawahnya
function aturTinggiHeader(){
  const el = document.getElementById('top-sticky');
  if(el) document.documentElement.style.setProperty('--header-h', el.offsetHeight+'px');
}
window.addEventListener('load', aturTinggiHeader);
window.addEventListener('resize', aturTinggiHeader);
aturTinggiHeader();

hariIni();
</script>
</body>
</html>
