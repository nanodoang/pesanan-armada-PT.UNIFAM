<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konfirmasi Armada — UNIFAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* v112 — SATU halaman konfirmasi untuk order LELANG dan ORDER LANGSUNG (Pesanan Armada).
   File yang sama diunggah ke repo lelang DAN repo Pesanan Armada. */
:root{
  --navy:#2A3180; --navy-tua:#1C2159; --teal:#1596A3; --teal-tua:#0E7A85;
  --panel:#FFFFFF; --line:#DDE2EC; --line-tebal:#C3CAD9;
  --text:#12172B; --muted:#5A6480; --amber:#D9820F; --red:#C8443A; --hijau:#12876B;
  --disp:'Barlow Condensed',Arial,sans-serif; --sans:'Barlow',Arial,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#EFF2F7;color:var(--text);font-family:var(--sans);font-size:14.5px;min-height:100vh;padding-bottom:60px}
header{background:var(--navy);color:#fff}
header .dalam{max-width:620px;margin:0 auto;padding:26px 20px 18px}
.baris-judul{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.logo-unifam{height:29px;width:auto;display:block;background:#fff;border-radius:5px;padding:3px 5px}
.eyebrow{font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase}
.sub{color:rgba(255,255,255,.85);font-size:13.5px;line-height:1.55;margin:8px 0 0}
.eks-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  padding:6px 14px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
#status-bar{max-width:620px;margin:12px auto 10px;padding:0 20px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
#status-bar.err{color:var(--red)} #status-bar.ok{color:var(--teal)}
main{max-width:620px;margin:0 auto;padding:0 20px}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(18,23,43,.05);margin-bottom:16px}
.card-head{padding:16px 18px 12px}
.no-order{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:9px 13px;margin:0 0 12px}
.no-order .no-l{font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.no-order .no-v{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.03em}
.no-order .jenis{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.12em;padding:2px 9px}
.jenis.lelang{background:var(--teal);color:#fff} .jenis.langsung{background:#fff;color:var(--navy)}
.route{font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05}
.route .arrow{color:var(--teal);margin:0 7px;font-weight:500}
.jenis-tag{display:inline-block;margin-top:8px;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.14em;padding:3px 10px;border:1px solid}
.jenis-tag.kontener{background:rgba(42,49,128,.1);color:var(--navy);border-color:rgba(42,49,128,.35)}
.jenis-tag.darat{background:rgba(21,150,163,.1);color:var(--teal-tua);border-color:rgba(21,150,163,.4)}
.rincian{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
.rincian dt{font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
.rincian dd{margin:0;font-weight:600}
.muat-box{margin:4px 18px 0;background:rgba(217,130,15,.1);border:1px solid rgba(217,130,15,.45);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.muat-box .lbl{font-family:var(--disp);font-size:10.5px;color:#B67A16;text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.muat-box .tgl{font-size:17px;font-weight:600;color:#8A5A0A;font-family:var(--mono);text-align:right}
.muat-box .jam{display:block;font-size:14px;font-weight:600;margin-top:2px}

/* kotak harga */
.harga-box{margin:14px 18px 0;border:2px solid var(--teal);background:rgba(21,150,163,.05);padding:13px 14px}
.harga-box.sah{border-color:rgba(18,135,107,.5);background:rgba(18,135,107,.06)}
.harga-box.tunggu{border-color:var(--amber);background:#FFF9F0}
.harga-box .l{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--teal-tua);text-transform:uppercase}
.harga-box .n{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--navy);margin:3px 0 2px}
.harga-box .n s{color:var(--muted);font-size:15px;font-weight:400;margin-right:6px}
.harga-box .s{font-size:12px;color:var(--muted)}
.harga-box .jejak{font-size:12.5px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.65}
.harga-box .jejak s{color:var(--muted)}
.harga-box .ok{font-size:13px;color:#0B6350;font-weight:600;margin-top:9px;line-height:1.5}
.pilih{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.pilih label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-tebal);background:#fff;padding:10px 11px;font-size:13.5px;line-height:1.45;cursor:pointer}
.pilih label b{font-weight:700}
.pilih label.on{border-color:var(--teal);background:rgba(21,150,163,.08)}
.pilih label.on.tolak{border-color:var(--amber);background:rgba(217,130,15,.08)}
.pilih label.merah{outline:2px solid var(--red);outline-offset:2px}
.pilih input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--teal);flex-shrink:0}
.usul{display:none;margin-top:9px;gap:8px;flex-direction:column}
.usul.buka{display:flex}
.catatan{background:#FFF6E8;border:1px solid rgba(217,130,15,.5);border-left:4px solid var(--amber);padding:10px 11px;font-size:12.5px;line-height:1.6;color:#5E3E06}
.catatan .jdl{display:block;font-family:var(--disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:#8A5A0A;margin-bottom:2px}
.catatan.biru{background:#F1F5FB;border-color:#C7D3EA;border-left-color:var(--navy);color:var(--text)}
.catatan.biru .jdl{color:var(--navy)}
.gugur{background:#FFF4E5;border:1px solid rgba(217,130,15,.5);padding:9px 11px;font-size:12.5px;line-height:1.55;margin-top:10px;color:#7A4A06}
.link-spk{display:inline-block;margin-top:9px;font-size:13px;font-weight:600;color:var(--navy)}

/* status unit (order langsung) */
.pil-status{display:flex;gap:8px;margin:14px 18px 0}
.pil-status button{flex:1;padding:11px;border:1.5px solid var(--line-tebal);background:#fff;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.pil-status button.on.ya{border-color:var(--hijau);background:rgba(18,135,107,.08);color:var(--hijau)}
.pil-status button.on.tidak{border-color:var(--red);background:rgba(200,68,58,.07);color:var(--red)}
.pil-status.merah button{border-color:var(--red)}

.form-wrap{border-top:1px solid var(--line);margin-top:16px;padding:16px 18px 18px;background:#FBFDFF}
.form-judul{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1 / -1}
label.f{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=time],textarea{background:#fff;border:1px solid var(--line-tebal);color:var(--text);padding:10px 12px;font-size:13.5px;font-family:var(--mono);width:100%;border-radius:0}
input[type=date],input[type=time]{min-height:44px}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus{outline:none;border-color:var(--navy)}
input.salah,textarea.salah{border-color:var(--red)}
.tunda{display:none;background:#F1F3F8;border:1px dashed #B9C1D3;padding:11px;font-size:13px;color:var(--muted);line-height:1.5}
.card.mode-tolak .blok-armada{display:none}
.card.mode-tolak .tunda{display:block}
.card.mode-tidak .blok-armada,.card.mode-tidak .harga-box{display:none}
.blok-alasan{display:none}
.card.mode-tidak .blok-alasan{display:block}
.btn-kirim{width:100%;background:var(--navy);color:#fff;border:none;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;padding:13px 18px;cursor:pointer;margin-top:14px}
.btn-kirim:hover{background:var(--navy-tua)}
.btn-kirim:disabled{opacity:.5;cursor:default}
.btn-kirim.ajukan{background:var(--amber);color:#2E1C03}
.sudah{background:rgba(18,135,107,.08);border:1px solid rgba(18,135,107,.4);padding:12px 14px;margin:14px 18px 16px;font-family:var(--mono);font-size:12px;color:#0B6350;line-height:1.7}
.sudah.tidak{background:rgba(200,68,58,.06);border-color:rgba(200,68,58,.35);color:#8E2A22}
.card-form .sudah{margin:0 0 14px}
.pesan-kosong{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;padding:36px 20px;background:var(--panel);border:1px dashed var(--line-tebal)}
.panel-wa{background:#fff;border:2px solid #25D366;padding:14px 16px;margin-bottom:16px;text-align:center}
.panel-wa p{margin:0 0 10px;font-size:13.5px;line-height:1.5}
.btn-wa{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#25D366;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
footer{max-width:620px;margin:26px auto 0;padding:16px 20px;color:#8FA7C2;font-size:11px;font-family:var(--mono);border-top:1px solid var(--line)}
@media (max-width:420px){ .form-grid{grid-template-columns:1fr} .route{font-size:20px} }
</style>
</head>

const params = new URLSearchParams(window.location.search);
function dec(s){ try{ return decodeURIComponent(s || ''); }catch(e){ return s || ''; } }

/* Link dari Pesanan Armada memakai ?order=&eksp=&gas= ; link lelang memakai ?order=&ekspedisi= */
const MANUAL = params.has('eksp') && !params.has('ekspedisi');

const ARMADA_GAS = dec(params.get('gas')) || ARMADA_GAS_BAWAAN;

/* ------------------------------------------------------------------ server */
let jsonpN = 0;
function jsonp(url, batasMs){
  return new Promise((resolve, reject) => {
    const cb = 'gascb' + (++jsonpN) + '_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { bersih(); reject(new Error('Koneksi lambat — server terlalu lama merespons. Coba muat ulang halaman.')); }, batasMs || 60000);
    function bersih(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = d => { bersih(); resolve(d); };
    s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + cb;
    s.onerror = () => { bersih(); reject(new Error('Gagal terhubung ke server')); };
    document.body.appendChild(s);
  });
}
function qs(p){ return Object.keys(p).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(p[k] == null ? '' : p[k])).join('&'); }

/* server lelang: fetch dulu, JSONP cadangan */
async function gas(p){
  const url = LELANG_GAS + '?' + qs(p);
  let sebab = '';
  try{
    const r = await fetch(url);
    if(!r.ok) sebab = 'server menjawab ' + r.status;
    else {
      const teks = await r.text();
      if(/^\s*<(!DOCTYPE|html)/i.test(teks)) throw new Error('Server mengembalikan halaman web, bukan data.');
      let d; try{ d = JSON.parse(teks); }catch(e){ throw new Error('Jawaban server tidak terbaca'); }
      if(d && d.error) throw new Error(d.error);
      return d;
    }
  }catch(e){
    if(!sebab) sebab = e.message;
    if(!/fetch|network|load|jaringan|server menjawab/i.test(sebab)) throw new Error(sebab);
  }
  try{
    const d = await jsonp(url);
    if(d && d.error) throw new Error(d.error);
    return d;
  }catch(e2){ throw new Error(e2.message || sebab); }
}
/* server Pesanan Armada: JSONP (seperti halaman lama) */
async function armada(p, batasMs){
  const d = await jsonp(ARMADA_GAS + '?' + qs(p), batasMs);
  if(d && d.status === 'error') throw new Error(d.message || 'Server Pesanan Armada error');
  return d;
}

function setStatus(teks, kelas){ const el = document.getElementById('status-bar'); el.textContent = teks; el.className = kelas || ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rp(n){ return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
function angkaDari(s){ return parseInt(String(s || '').replace(/[^\d]/g, ''), 10) || 0; }
function formatKetik(el){ const n = angkaDari(el.value); el.value = n ? n.toLocaleString('id-ID') : ''; }
function nilai(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function tandai(id, salah){ const el = document.getElementById(id); if(el) el.classList.toggle('salah', !!salah); return el; }
function normTujKunci(s){ return String(s || '').replace(/\([^)]*\)/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function keISO(t){
  if(!t) return '';
  const s = String(t).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function keLokal(iso){ const m = String(iso || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso || '').trim(); }
function jenisKiriman(tipe){
  const t = String(tipe || '').toUpperCase();
  return /\b(20|40|45)\s*(FT|FEET|')|KONTENER|KONTAINER|CONTAINER|\bHC\b|\bREEFER\b/.test(t) ? 'kontener' : 'darat';
}
function pisahTujuan(teks){
  const bersih = String(teks || '').replace(/\s*\([^()]*\)\s*$/, '').trim();
  const pos = bersih.lastIndexOf(' - ');
  return pos > -1 ? { customer: bersih.slice(0, pos).trim(), kota: bersih.slice(pos + 3).trim() } : { customer: bersih, kota: '' };
}
function normHP(hp){
  let s = String(hp || '').replace(/[^\d]/g, '');
  if(!s) return '';
  if(s.indexOf('62') === 0) return s;
  if(s.indexOf('0') === 0) return '62' + s.slice(1);
  if(s.indexOf('8') === 0) return '62' + s;
  return s;
}

function kotakHarga(o){

  const jejak = o.jejak && o.jejak.length ? `<div class="jejak">${o.jejak.join('<br>')}</div>` : '';

    const dariAjuan = pj && pj.status === 'disetujui'
      ? `<div class="ok">✓ Harga pengajuan Anda <b>disetujui UNIFAM</b>${pj.oleh ? ' (' + esc(pj.oleh) + ')' : ''} ${esc(pj.waktuPutus)}</div>` : '';
    return `<div class="harga-box sah">
      <div class="l">Harga yang ditagihkan</div>
      <div class="n">${o.awalCoret ? '<s>' + rp(o.awalCoret) + '</s>' : ''}${rp(o.berlaku)}</div>${syarat}${jejak}
      ${dariAjuan || (o.sahTeks ? `<div class="ok">${o.sahTeks}</div>` : '')}
      ${o.spk ? `<a class="link-spk" href="${o.spk}" target="_blank">Lihat / simpan dokumen SPK →</a>` : ''}

  }

  const ditolak = pj && pj.status === 'ditolak';
  const bisaAjukan = !ditolak && o.bisaAjukan !== false;
  const noteTolak = ditolak ? `<div class="catatan biru" style="margin-top:10px"><span class="jdl">Pengajuan harga belum dapat kami setujui</span>
      Mohon maaf, pengajuan harga ${rp(pj.hargaUsul)} (${esc(pj.waktu)}) belum dapat kami setujui${pj.catatan ? ': <i>' + esc(pj.catatan) + '</i>' : ''}.

    <div class="l">Harga yang ditagihkan</div>
    <div class="n">${berlakuTeks}</div>${syarat}${jejak}${o.gugur || ''}${noteTolak}

function pilihanHarga(id){
  const r = document.querySelector(`input[name="hp-${id}"]:checked`);
  return r ? r.value : '';
}
function pilihHarga(id){
  const v = pilihanHarga(id);
  ['ok','tolak'].forEach(k => { const l = document.getElementById(`lbl-${k}-${id}`); if(l){ l.classList.toggle('on', v === k); l.classList.remove('merah'); } });
  const u = document.getElementById('usul-' + id); if(u) u.classList.toggle('buka', v === 'tolak');
  const card = document.getElementById('card-' + id); if(card) card.classList.toggle('mode-tolak', v === 'tolak');
  aturTombol(id);
}
function aturTombol(id){
  const btn = document.getElementById('btn-' + id); if(!btn || btn.dataset.kunci) return;
  const card = document.getElementById('card-' + id);
  const tolak = pilihanHarga(id) === 'tolak' && !(card && card.classList.contains('mode-tidak'));
  btn.classList.toggle('ajukan', tolak);
  btn.textContent = tolak ? 'Kirim pengajuan harga' : (card && card.classList.contains('mode-tidak') ? 'Kirim: armada tidak tersedia' : (btn.dataset.teks || 'Kirim konfirmasi'));
}
function cekPilihan(id, wajib){
  const v = pilihanHarga(id);
  if(wajib && !v){
    const p = document.getElementById('pilih-' + id);
    if(p){ p.querySelectorAll('label').forEach(l => l.classList.add('merah')); p.scrollIntoView({behavior:'smooth', block:'center'}); }
    setStatus('Pilih dulu: setuju harga, atau ajukan harga lain.', 'err');
    return null;
  }
  return v;
}
function bacaUsul(id){
  const h = angkaDari(nilai('usul-harga-' + id)), a = nilai('usul-alasan-' + id);

  if(!h || !a){ setStatus('Isi harga yang diajukan dan alasannya.', 'err'); return null; }
  return { harga: h, alasan: a };
}

let lelang = null, bidSaya = null, konfirmasiSaya = null, orderIni = null, hargaInfo = null, pengajuanL = null;

async function muatLelang(){
  if((!idOrder && !idLelang) || !namaEkspedisi){
    setStatus('Link tidak lengkap — minta admin kirim ulang link konfirmasinya.', 'err');
    document.getElementById('isi').innerHTML = `<div class="pesan-kosong">Link konfirmasi tidak valid.</div>`;
    return;
  }
  try{
    setStatus('Memuat data…');
    const d = await gas({action:'konfirmasi_data', idOrder, idLelang, ekspedisi:namaEkspedisi});
    orderIni = d.order || null; lelang = d.lelang || null; bidSaya = d.bid || null;
    konfirmasiSaya = d.konfirmasi || null; hargaInfo = d.harga || null; pengajuanL = d.pengajuan || null;
    setStatus(`Data terbaru · ${new Date().toLocaleTimeString('id-ID')}`);
    renderLelang();
  }catch(err){ setStatus('Gagal memuat: ' + err.message, 'err'); }
}

/* ================================================================== MODE ORDER LANGSUNG */
let units = [], pjManual = {}, hargaCsv = [], sesiTerkirim = [], waManual = '';
const HARGA_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWWl6xUcwoS3ym-dPPunI4XIWrZoi8VbeKDV-myqhTIdpsBGM7AgzXXWUFidZJTFjXgCyGANUR-vjf/pub?gid=591450213&single=true&output=csv';

/* --- harga dari tabel rate (cadangan bila harga tak tercantum di order) — sama seperti halaman lama --- */
function parseCSV(text){
  const rows = []; let cur = [], val = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){ if(c === '"'){ if(text[i+1] === '"'){ val += '"'; i++; } else inQ = false; } else val += c; }
    else if(c === '"') inQ = true;
    else if(c === ','){ cur.push(val); val = ''; }
    else if(c === '\n'){ cur.push(val); rows.push(cur); cur = []; val = ''; }
    else if(c !== '\r') val += c;
  }
  if(val.length || cur.length){ cur.push(val); rows.push(cur); }
  return rows;
}
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
async function loadHarga(){
  try{
    const rows = parseCSV(await (await fetch(HARGA_CSV)).text());
    const head = rows[0].map(norm);
    const idx = names => head.findIndex(h => names.some(n => h.includes(n)));
    const iV = idx(['vehicle']), iD = idx(['description','tujuan']), iP = idx(['price','harga']), iE = idx(['expedition','ekspedisi']);
    hargaCsv = rows.slice(1).filter(r => r.length > 1).map(r => ({ vtype:r[iV] || '', dest:r[iD] || '', price:angkaDari(String(r[iP] || '').replace(/,\d{1,2}$/, '')), expedition: iE >= 0 ? (r[iE] || '') : '' }))
      .filter(r => r.dest && r.price > 0);
  }catch(e){ hargaCsv = []; }
}
const TIPE_MAP = { '20 ft':'Kontainer-20" 32', '20 ft c':'Kontainer-20" 32 (C)', '40 ft':'Kontainer-40"HQ 72' };
function lookupHarga(kode, tujuan, tipe){
  if(!hargaCsv.length) return null;
  const e = norm(kode), t = norm(tujuan), v = norm(TIPE_MAP[norm(tipe)] || tipe);
  const cocok = h => norm(h.dest) === t || norm(h.dest).includes(t) || t.includes(norm(h.dest));
  return hargaCsv.find(h => norm(h.expedition) === e && cocok(h) && norm(h.vtype) === v)
      || (!v && hargaCsv.find(h => norm(h.expedition) === e && cocok(h)))
      || hargaCsv.find(h => cocok(h) && norm(h.vtype) === v)
      || (!v && hargaCsv.find(h => cocok(h))) || null;
}
function isKontainerManual(tipe){ const t = String(tipe || '').toLowerCase().replace(/\s+/g, ''); return t === '20ft' || t === '20ftc' || t === '40ft'; }

async function muatManual(){
  if(!noOrderManual){
    setStatus('Link tidak lengkap — minta admin kirim ulang link konfirmasinya.', 'err');
    document.getElementById('isi').innerHTML = `<div class="pesan-kosong">Link konfirmasi tidak valid.</div>`;
    return;
  }
  setStatus('Memuat data…');
  const tugasPj = gas({action:'pengajuan_manual', no:noOrderManual, ekspedisi:namaEkspedisi}).catch(() => null);
  let d;
  try{ d = await armada({action:'getorder', no_order:noOrderManual}, 30000); }
  catch(err){ setStatus('Gagal memuat: ' + err.message, 'err'); return; }
  const pj = await tugasPj;
  pjManual = (pj && pj.pengajuan) || {};
  units = (d.orders || []).map((o, i) => Object.assign(o, {
    i, kunci: 'M|' + (o.no_order || noOrderManual) + '|' + normTujKunci(o.tuj), kontener: isKontainerManual(o.tipe)
  }));
  if(!units.length){

    document.getElementById('isi').innerHTML = `<div class="pesan-kosong">Data pesanan tidak ditemukan. Hubungi admin UNIFAM.</div>`;
    return;
  }
  if(units.some(u => u.kontener && !(Number(u.harga) > 0))){
    await Promise.race([loadHarga(), new Promise(r => setTimeout(r, 5000))]);
  }
  units.forEach(u => {
    u.hargaOrder = Number(u.harga) || 0;
    if(!u.hargaOrder && u.kontener){ const hit = lookupHarga(u.eksp_code, u.tuj, u.tipe); if(hit) u.hargaOrder = hit.price; }
  });
  setStatus(`Data terbaru · ${new Date().toLocaleTimeString('id-ID')}${pj ? '' : ' · status pengajuan harga tidak terbaca'}`, pj ? '' : 'err');
  renderManual();
}

  let hargaKirim = '', statusHarga = '';

  if(tersedia && u.kontener && !disetujui){
    const pil = cekPilihan(i, true); if(!pil) return;

      const us = bacaUsul(i); if(!us) return;

      return;
    }

  if(tersedia && u.kontener && disetujui){ hargaKirim = String(pj.hargaUsul); statusHarga = 'Disetujui UNIFAM (Pengajuan)'; }

  if(tersedia){
    const kurang = ['nopol','nama','hp'].filter(k => !nilai(k + '-' + i));

    nopol: tersedia ? nilai('nopol-' + i).toUpperCase() : '',
    no_kontener: tersedia && u.kontener ? nilai('kont-' + i).toUpperCase() : '',
    nama_kapal: tersedia && u.kontener ? nilai('kapal-' + i) : '',
    est_tiba: tersedia ? nilai('est-' + i) : '',
    etd: tersedia && u.kontener ? nilai('etd-' + i) : '', eta: tersedia && u.kontener ? nilai('eta-' + i) : '',
    harga: hargaKirim, harga_status: statusHarga,
    alasan: tersedia ? '' : nilai('alasan-' + i), status: tersedia ? 'Tersedia' : 'Tidak Tersedia'
  };
  btn.disabled = true; setStatus('Menyimpan konfirmasi…');
  let ok = false, galat = '';
  for(let coba = 0; coba < 3 && !ok; coba++){
    try{ await armada(data, 20000); ok = true; }
    catch(e){ galat = e.message; if(coba < 2) await new Promise(r => setTimeout(r, 1200)); }
  }
  if(!ok){ setStatus('Gagal menyimpan: ' + galat + ' — tekan Kirim lagi.', 'err'); btn.disabled = false; return; }

  u.sudahKonfirmasi = true; u.konf_status = data.status; u.konf_nopol = data.nopol; u.konf_sopir = data.nama_sopir;
  sesiTerkirim.push({ u, data });
  waManual = tombolWA('Konfirmasi tersimpan. Langkah terakhir: kirim notifikasi ke admin.', teksKonfirmasiWA());
  setStatus('Konfirmasi tersimpan. Terima kasih.', 'ok');
  renderManual(); window.scrollTo({top:0, behavior:'smooth'});
}

function teksKonfirmasiWA(){
  let ringkas = '';
  sesiTerkirim.forEach(({u, data}) => {
    ringkas += `\n📦 *${data.no_order}*\n`;
    if(data.status === 'Tersedia'){
      ringkas += `🎯 *${u.tuj}*\n   Sopir : ${data.nama_sopir} (${normHP(data.hp_sopir) || '-'})\n   Nopol : ${data.nopol}${data.no_kontener ? ' | Kont: ' + data.no_kontener : ''}\n`;
      if(data.nama_kapal) ringkas += `   🚢 Kapal : ${data.nama_kapal}\n`;
      if(u.kontener) ringkas += `   ETD Kapal : ${data.etd || '-'}  |  ETA Kapal : ${data.eta || '-'}\n`;
      ringkas += `   Tiba Gd. UNIFAM : ${data.est_tiba || '-'} WIB\n`;
      if(u.kontener) ringkas += `   Harga : ${data.harga ? rp(data.harga) : '-'}${data.harga_status === 'Sesuai' ? ' ✓' : data.harga_status ? ' (pengajuan disetujui)' : ''}\n`;
    } else ringkas += `❌ *${u.tuj}* — Tidak Tersedia\n   Alasan: ${data.alasan || '-'}\n`;
  });
  const hpE = normHP(params.get('hp_eksp') || '');
  const setuju = `✅ *DISETUJUI* — ${noOrderManual}\nArmada Anda disetujui. Mohon siapkan sesuai jadwal. Terima kasih 🙏\n_PT. UNIFAM_`;
  const revisi = `⚠️ *PERLU KOORDINASI* — ${noOrderManual}\nAda yang perlu kami koordinasikan. Tim kami akan menghubungi Anda. Terima kasih 🙏\n_PT. UNIFAM_`;
  const ke = t => hpE ? `https://wa.me/${hpE}?text=${encodeURIComponent(t)}` : `https://wa.me/?text=${encodeURIComponent(t)}`;
  return `🔔 *KONFIRMASI ARMADA MASUK*
PT. UNIFAM

📋 No. Order : *${noOrderManual}*
🚛 Ekspedisi : *${ekspAsli}*
🕐 Waktu     : ${new Date().toLocaleString('id-ID')}
${ringkas}
━━━━━━━━━━━━━━━━
Ketuk untuk kirim balasan ke ekspedisi:

✅ *SETUJUI* → ${ke(setuju)}

⚠️ *REVISI* → ${ke(revisi)}`;
}

/* ------------------------------------------------------------------ mulai */
renderHeader();
if(MANUAL) muatManual(); else muatLelang();
</script>
